<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>accoTOOL FP&amp;A App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap">
<style>
/* Layout: Power BI App chrome — themed app header, action bar, collapsible left report/page navigation, grey canvas with a white report page, collapsible Filters pane on the right. */
:root{
  --hdr:#1C4E80; --hdr-fg:#ffffff; --hdr-soft:rgba(255,255,255,.14);
  --bg:#e7ebf0; --nav:#f7f8fa; --nav-hover:#eceff3; --nav-sel:#dde8f3;
  --page:#ffffff; --ink:#1A2230; --muted:#5b6676; --line:#dce4ec; --line-2:#c6d1dc;
  --accent:#2E8BC0; --brand:#1C4E80; --orange:#F7941D; --teal:#2098A9;
  --ro:#f4f6f9; --sub:#eaf1f7; --pend:#fff0cc; --pend-ink:#7a4a00; --act-col:#eef1f4;
  --good:#23824f; --bad:#c03a2f; --warn:#a96d07;
  --good-bg:#e3f3ea; --bad-bg:#fbe7e5; --warn-bg:#fdf1d8; --info-bg:#e5f0f8;
  --c1:#1C4E80; --c2:#2E8BC0; --c3:#2098A9; --c4:#F7941D; --c5:#8C6BB1; --cref:#a9b6c4;
  --shadow:0 1px 2px rgba(20,40,60,.07),0 3px 10px rgba(20,40,60,.06);
  --f-ui:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-head:"Poppins","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hdr:#14385d; --hdr-soft:rgba(255,255,255,.12);
  --bg:#0e1319; --nav:#151b22; --nav-hover:#1d252f; --nav-sel:#20344a;
  --page:#19202a; --ink:#e6ecf2; --muted:#9aa8b8; --line:#2a3440; --line-2:#3a4756;
  --accent:#4fa6d8; --brand:#8bbbe6; --ro:#1e2630; --sub:#21303f; --pend:#4a3812; --pend-ink:#ffd58a; --act-col:#1c232c;
  --good:#4cc07f; --bad:#ef6b5f; --warn:#e3aa3e;
  --good-bg:#173226; --bad-bg:#3a1c1a; --warn-bg:#3a2e14; --info-bg:#18293a;
  --c1:#5f97cf; --c2:#4fb0e0; --c3:#3bc0cf; --c4:#f7a33d; --c5:#b195d6; --cref:#566475;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --hdr:#14385d; --hdr-soft:rgba(255,255,255,.12);
  --bg:#0e1319; --nav:#151b22; --nav-hover:#1d252f; --nav-sel:#20344a;
  --page:#19202a; --ink:#e6ecf2; --muted:#9aa8b8; --line:#2a3440; --line-2:#3a4756;
  --accent:#4fa6d8; --brand:#8bbbe6; --ro:#1e2630; --sub:#21303f; --pend:#4a3812; --pend-ink:#ffd58a; --act-col:#1c232c;
  --good:#4cc07f; --bad:#ef6b5f; --warn:#e3aa3e;
  --good-bg:#173226; --bad-bg:#3a1c1a; --warn-bg:#3a2e14; --info-bg:#18293a;
  --c1:#5f97cf; --c2:#4fb0e0; --c3:#3bc0cf; --c4:#f7a33d; --c5:#b195d6; --cref:#566475;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.4}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:48px 38px minmax(0,1fr)}
/* header */
.top{background:var(--hdr);color:var(--hdr-fg);display:flex;align-items:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.top .iconbtn{background:transparent;border:0;color:inherit;width:34px;height:34px;display:grid;place-items:center;border-radius:4px;flex:none}
.top .iconbtn:hover{background:var(--hdr-soft)}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.logo .mark{width:26px;height:26px;border-radius:5px;background:#fff;display:grid;place-items:center}
.appname{font-family:var(--f-head);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.appname small{font-family:var(--f-ui);font-weight:400;opacity:.75;font-size:12px;margin-left:8px}
.top .spacer{flex:1}
.viewas{display:flex;align-items:center;gap:8px;min-width:0}
.viewas label{font-size:11px;opacity:.8;white-space:nowrap}
.viewas select{background:var(--hdr-soft);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:4px;padding:4px 6px;max-width:230px}
.viewas select option{color:#1A2230;background:#fff}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#1A2230;font-weight:700;display:grid;place-items:center;font-size:12px;flex:none}
/* action bar */
.actionbar{background:var(--page);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;white-space:nowrap}
.actionbar .crumb{font-weight:600;margin-right:12px;display:flex;gap:6px;align-items:center}
.actionbar .crumb span{color:var(--muted);font-weight:400}
.abtn{background:transparent;border:0;padding:6px 9px;border-radius:4px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.abtn:hover{background:var(--nav-hover)}
.abtn svg{opacity:.75}
.actionbar .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.actionbar .stamp{margin-left:auto;color:var(--muted);font-size:12px;padding-left:12px}
/* main */
.main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;min-height:0}
.nav{width:252px;background:var(--nav);border-right:1px solid var(--line);overflow-y:auto;transition:width .18s ease;display:flex;flex-direction:column}
.app.nav-off .nav{width:0;border-right:0;overflow:hidden}
.nav-inner{width:252px;padding:10px 0 16px}
.nav-title{padding:6px 16px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nitem{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:8px 12px 8px 14px;border-left:3px solid transparent;color:var(--ink)}
.nitem:hover{background:var(--nav-hover)}
.nitem.sel{background:var(--nav-sel);border-left-color:var(--brand);font-weight:600}
.nitem .chev{margin-left:auto;transition:transform .15s;opacity:.7}
.nitem.open .chev{transform:rotate(90deg)}
.nitem .lock{margin-left:auto;opacity:.6}
.nitem.report{font-weight:600}
.nitem.page{padding-left:42px;font-weight:400;font-size:12.5px}
.nitem.page.sel{font-weight:600}
.nav .tag{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--line);color:var(--muted);margin-left:auto;font-weight:600}
.canvas{overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.rpage{background:var(--page);max-width:1320px;margin:0 auto;box-shadow:var(--shadow);border-radius:2px;min-height:calc(100% - 4px)}
/* filters pane */
.fpane{width:34px;background:var(--page);border-left:1px solid var(--line);transition:width .18s;overflow:hidden;display:flex}
.fpane.open{width:240px}
.fpane .ftoggle{width:34px;flex:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:12px;color:var(--muted)}
.fpane .ftoggle span{writing-mode:vertical-rl;font-size:12px;letter-spacing:.04em}
.fpane .fbody{width:206px;padding:12px 12px 12px 0;overflow-y:auto}
.fpane h4{margin:6px 0 8px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.fcard{border:1px solid var(--line);border-radius:3px;padding:7px 9px;margin-bottom:8px;background:var(--ro)}
.fcard b{display:block;font-size:12px}
.fcard span{color:var(--muted);font-size:12px}
/* page header */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.phead .ttl{flex:1 1 260px;min-width:0}
.phead h1{font-family:var(--f-head);font-weight:600;font-size:20px;margin:0;text-wrap:balance;color:var(--ink)}
.phead p{margin:3px 0 0;color:var(--muted);max-width:70ch}
.slicers{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.slicer{display:flex;flex-direction:column;gap:3px;min-width:150px}
.slicer>span{font-size:11px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.slicer select,.slicer input{border:1px solid var(--line-2);background:var(--page);border-radius:3px;padding:5px 8px;min-width:0}
.wtag{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--orange);border:1px solid currentColor;border-radius:3px;padding:0 4px}
.pbody{padding:18px 22px 26px;display:flex;flex-direction:column;gap:18px}
.row2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px}
.row2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:1000px){.row2,.row2e{grid-template-columns:minmax(0,1fr)}}
/* tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:3px;padding:11px 13px;background:var(--page)}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-head);font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--muted);font-family:var(--f-ui);font-weight:400;margin-left:3px}
.kpi .d{font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
/* generic visual container */
.vis{border:1px solid var(--line);border-radius:3px;background:var(--page);min-width:0}
.vis-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.vis-head h3{margin:0;font-size:13.5px;font-weight:600}
.vis-head .sub{color:var(--muted);font-size:12px}
.vis-tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vis-body{padding:12px}
.badge{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:3px;color:#fff;white-space:nowrap}
.badge.ap{background:var(--brand)} .badge.am{background:var(--teal)}
:root[data-theme="dark"] .badge.ap{color:#0e1319}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.ap{color:#0e1319}}
.vis-foot{padding:7px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.vis-foot code{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:11px;color:var(--ink)}
.btn{border:1px solid var(--line-2);background:var(--page);border-radius:3px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center}
.btn:hover:not(:disabled){background:var(--nav-hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1319}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1319}}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--brand)}
.btn.warn{border-color:var(--orange);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
.cnt{font-size:12px;color:var(--pend-ink);background:var(--pend);padding:2px 8px;border-radius:10px;font-weight:600}
.cnt[data-n="0"]{visibility:hidden}
.ro-pill{font-size:11.5px;color:var(--muted);border:1px dashed var(--line-2);padding:2px 8px;border-radius:10px}
.banner{margin:10px 12px 0;padding:8px 11px;border-radius:3px;background:var(--warn-bg);color:var(--ink);font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.banner.info{background:var(--info-bg)}
.banner b{font-weight:600}
/* grids */
.grid-wrap{overflow:auto;max-height:560px;margin-top:10px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
.grid th,.grid td{border-bottom:1px solid var(--line);white-space:nowrap;padding:0}
.grid thead th{position:sticky;top:0;background:var(--page);z-index:2;text-align:right;padding:7px 8px;font-weight:600;color:var(--muted);font-size:11.5px;border-bottom:2px solid var(--line-2)}
.grid thead th small{display:block;font-weight:400;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}
.grid thead th.l,.grid td.l{text-align:left}
.grid .rh{position:sticky;left:0;background:var(--page);z-index:1;text-align:left;padding:6px 10px;font-weight:400;min-width:230px;max-width:300px;white-space:normal}
.grid thead .rh{z-index:3}
.grid td.num{text-align:right;padding:6px 8px;min-width:64px}
.grid td.ro{background:var(--ro)}
.grid td.actc,.grid th.actc{background:var(--act-col)}
.grid td.fy{font-weight:600;text-align:right;padding:6px 10px;border-left:1px solid var(--line-2);min-width:76px}
.grid tr.sub td,.grid tr.sub th{background:var(--sub);font-weight:600}
.grid tr.strong td,.grid tr.strong th{border-top:1px solid var(--line-2);border-bottom:2px solid var(--line-2)}
.grid .code{color:var(--muted);font-size:11px;margin-right:4px;font-variant-numeric:tabular-nums}
.grid td.in{background:var(--page);min-width:70px;box-shadow:inset 0 0 0 1px transparent}
.grid td.in:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.grid td.in.pend{background:var(--pend)}
.grid td.in.pend input,.grid td.in.pend select{color:var(--pend-ink);font-weight:600}
.cell{width:100%;border:0;background:transparent;text-align:right;padding:6px 8px;min-width:0;outline:none}
.cell:focus{box-shadow:inset 0 0 0 2px var(--accent);background:var(--page)}
.cell.t{text-align:left}
select.cell{text-align:left;padding:5px 4px;appearance:auto;background:transparent}
td.chk{text-align:center}
td.chk input{width:16px;height:16px;accent-color:var(--brand)}
.grid td.cm{min-width:200px}
.grid td.txt{padding:6px 8px;text-align:left}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line-2);color:var(--muted);background:var(--page);margin-left:6px;cursor:pointer;white-space:nowrap;vertical-align:1px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.drv{border-color:var(--orange);color:var(--warn)}
.delbtn{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:3px}
.delbtn:hover{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill.ns{background:var(--line);color:var(--muted)}
.pill.ip{background:var(--info-bg);color:var(--accent)}
.pill.sb{background:var(--warn-bg);color:var(--warn)}
.pill.ap{background:var(--good-bg);color:var(--good)}
.pill.lk{background:var(--bad-bg);color:var(--bad)}
.pill.op{background:var(--good-bg);color:var(--good)}
/* simple table */
table.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:2px solid var(--line-2);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.tbl tr.sub td{background:var(--sub);font-weight:600}
.tblwrap{overflow-x:auto}
/* charts */
.chart{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:2px;width:14px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--muted);font-size:10.5px;font-family:var(--f-ui)}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .zl{stroke:var(--line-2);stroke-width:1}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:6px 10px;align-items:center;font-size:12.5px}
.hbar .track{height:20px;background:var(--ro);border-radius:2px;position:relative;overflow:hidden}
.hbar .fill{position:absolute;inset:0 auto 0 0;background:var(--c2)}
.hbar .fill.w{background:var(--c1)}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums}
/* map */
.map-wrap{overflow-x:auto}
svg.map{width:100%;min-width:640px;height:auto;display:block}
svg.map text{font-family:var(--f-ui);fill:var(--ink)}
svg.map .mapbox{cursor:pointer}
svg.map .mapbox rect{transition:stroke .15s}
svg.map .mapbox:hover rect.b,svg.map .mapbox:focus rect.b{stroke:var(--accent);stroke-width:2}
svg.map .t1{font-weight:600;font-size:13.5px}
svg.map .t2{font-size:11.5px;fill:var(--muted)}
svg.map .t3{font-size:12px;font-weight:600;fill:var(--brand)}
svg.map .lbl{font-size:11px;fill:var(--muted)}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form input[type=text],.form input[type=number],.form select{border:1px solid var(--line-2);border-radius:3px;padding:6px 8px;background:var(--page);font-weight:400;color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:4px}
.checks label{flex-direction:row;align-items:center;gap:6px;font-weight:400;color:var(--ink)}
.checks input{accent-color:var(--brand)}
.prog{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.prog span{display:block;height:100%}
.note{color:var(--muted);font-size:12px;max-width:80ch}
.note a,.link{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0}
.restricted{padding:60px 22px;text-align:center;color:var(--muted)}
.restricted h2{font-family:var(--f-head);color:var(--ink);font-size:18px;margin:10px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--page);padding:9px 16px;border-radius:4px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);font-size:12.5px}
.toast.on{opacity:1;transform:translateX(-50%)}
.scrim{display:none}
@media (max-width:820px){
  .nav{position:fixed;top:calc(86px + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:30;box-shadow:var(--shadow);width:252px}
  .app.nav-off .nav{width:0}
  .app:not(.nav-off) .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:25}
  .fpane{display:none}
  .appname small,.viewas label{display:none}
  .viewas select{max-width:150px}
  .phead,.pbody{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="iconbtn" data-act="toggleNav" aria-label="Show or hide navigation">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>

 let d='';if(refVal!=null){const diff=val-refVal;const isUp=diff>0.0001,isDn=diff<-0.0001;const fav=good==='up'?isUp:good==='down'?isDn:false;const unfav=good==='up'?isDn:good==='down'?isUp:false;

function niceTicks(mn,mx,n=5){if(mn===mx){mx=mn+1}const raw=(mx-mn)/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const st=[1,2,2.5,5,10].map(x=>x*p).find(x=>x>=raw)||raw;const a=Math.floor(mn/st)*st,b=Math.ceil(mx/st)*st;const t=[];for(let x=a;x<=b+st/2;x+=st)t.push(Math.round(x*1e6)/1e6);return t}
const fShort=v=>Math.abs(v)>=1000?nf1.format(v/1000)+'m':f0(v)+'k';
function chart({cats=MONTHS,series,h=230,stacked=false,fmt=fShort,label=''}){
 const W=680,H=h,pl=50,pr=12,pt=10,pb=24;const bars=series.filter(s=>s.type!=='line'),lines=series.filter(s=>s.type==='line');
 let vals=[0];if(stacked)cats.forEach((_,i)=>{let p=0,n=0;bars.forEach(s=>{const v=s.vals[i];v>=0?p+=v:n+=v});vals.push(p,n)});else bars.forEach(s=>vals.push(...s.vals));
 lines.forEach(s=>vals.push(...s.vals));const tk=niceTicks(Math.min(...vals),Math.max(...vals));const mn=tk[0],mx=tk[tk.length-1];
 const y=v=>pt+(mx-v)/(mx-mn||1)*(H-pt-pb);const bw=(W-pl-pr)/cats.length;let g='';
 tk.forEach(t=>{g+=`<line class="${t===0?'zl':'gl'}" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`});
 cats.forEach((c,i)=>{g+=`<text x="${pl+bw*i+bw/2}" y="${H-6}" text-anchor="middle">${esc(c)}</text>`});
 if(stacked){cats.forEach((c,i)=>{let p=0,n=0;const w=bw*.62,x=pl+bw*i+(bw-w)/2;bars.forEach(s=>{const v=s.vals[i];if(!v)return;let y0,y1;if(v>=0){y0=y(p+v);y1=y(p);p+=v}else{y0=y(n);y1=y(n+v);n+=v}
  g+=`<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(0,y1-y0)}" style="fill:var(${s.color})"><title>${esc(s.name)} · ${esc(c)}: ${fmt(v)}</title></rect>`})})}
 else{const nb=bars.length||1,gw=bw*.72,w=gw/nb;bars.forEach((s,j)=>s.vals.forEach((v,i)=>{const x=pl+bw*i+(bw-gw)/2+w*j;const y0=Math.min(y(v),y(0)),hh=Math.abs(y(v)-y(0));
  g+=`<rect x="${x+.5}" y="${y0}" width="${Math.max(1,w-1)}" height="${hh}" style="fill:var(${s.color})"><title>${esc(s.name)} · ${esc(cats[i])}: ${fmt(v)}</title></rect>`}))}
 lines.forEach(s=>{const pts=s.vals.map((v,i)=>`${pl+bw*i+bw/2},${y(v)}`).join(' ');g+=`<polyline points="${pts}" fill="none" style="stroke:var(${s.color})" stroke-width="2.2" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
  s.vals.forEach((v,i)=>{g+=`<circle cx="${pl+bw*i+bw/2}" cy="${y(v)}" r="${i===s.vals.length-1?4:2.6}" style="fill:var(${s.color});stroke:var(--page)" stroke-width="1.2"><title>${esc(s.name)} · ${esc(cats[i])}: ${fmt(v)}</title></circle>`})});
 return `<div class="chart">${legend(series)}<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg></div>`}
function waterfall(steps,{h=300,fmt=fShort}={}){
 const W=460,H=h,pl=50,pr=12,pt=14,pb=34;let run=0;const bars=steps.map(s=>{if(s.total){const b={...s,a:0,b:s.val};run=s.val;return b}const b={...s,a:run,b:run+s.val};run+=s.val;return b});
 const vals=[0,...bars.flatMap(b=>[b.a,b.b])];const tk=niceTicks(Math.min(...vals),Math.max(...vals));const mn=tk[0],mx=tk[tk.length-1];
 const y=v=>pt+(mx-v)/(mx-mn||1)*(H-pt-pb);const bw=(W-pl-pr)/bars.length;let g='';
 tk.forEach(t=>{g+=`<line class="${t===0?'zl':'gl'}" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`});
 bars.forEach((b,i)=>{const x=pl+bw*i+bw*.18,w=bw*.64;const y0=y(Math.max(b.a,b.b)),hh=Math.max(1,Math.abs(y(b.a)-y(b.b)));const col=b.total?'--c1':b.val>=0?'--good':'--bad';
  g+=`<rect x="${x}" y="${y0}" width="${w}" height="${hh}" style="fill:var(${col})"><title>${esc(b.label)}: ${fmt(b.val)}</title></rect>`;
  g+=`<text x="${x+w/2}" y="${y0-4}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${b.total?'':(b.val>=0?'+':'')}${fmt(b.val)}</text>`;
  g+=`<text x="${x+w/2}" y="${H-18}" text-anchor="middle">${esc(b.label)}</text>`;if(b.sub)g+=`<text x="${x+w/2}" y="${H-5}" text-anchor="middle">${esc(b.sub)}</text>`;
  if(i<bars.length-1)g+=`<line x1="${x+w}" x2="${x+bw}" y1="${y(b.b)}" y2="${y(b.b)}" class="zl" stroke-dasharray="2 2"/>`});
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="EBITDA bridge">${g}</svg>`}

 if(o.banner)h+=`<div class="banner ${o.bannerInfo?'info':''}">${o.banner}</div>`;
 h+=`<div class="grid-wrap"><table class="grid"><thead><tr><th class="rh">${esc(o.first||'Account')}</th>`+MONTHS.map((m,i)=>`<th class="${i<actual?'actc':''}">${m}<small>${i<actual?'Actual':(o.colTag||'Plan')}</small></th>`).join('')+`<th>FY</th>${comment?'<th class="l">Comment</th>':''}</tr></thead><tbody>`;
 rows.forEach(r=>{

   if(ed&&i>=actual){const p=k in PEND;h+=`<td class="in ${p?'pend':''}"><input class="cell" data-vis="${id}" data-r="${esc(r.key)}" data-c="${i}" data-t="n" data-sign="${r.sign||1}" data-o="${f0(v)}" value="${p?esc(PEND[k]):f0(v)}" inputmode="decimal" aria-label="${esc(r.label)} ${MONTHS[i]}"></td>`}
   else h+=`<td class="num ${i<actual?'actc':'ro'}" data-v="${v}">${f0(v)}</td>`});
  h+=`<td class="fy">${f0(sum(r.vals))}</td>`;

  h+='</tr>'});
 h+=`</tbody></table></div>${o.foot?visFoot(o.table,o.foot):visFoot(o.table)}</section>`;return h}

/* ---------- accoMASTERDATA grid (one row per key) ---------- */
function amGrid(o){
 const {id,title,cols,rows,key='id'}=o;const anyEdit=rows.some(r=>o.canEditRow(r));const showTools=o.editableVisual!==false&&(anyEdit||o.add);
 let h=`<section class="vis"><div class="vis-head"><span class="badge am">accoMASTERDATA</span><h3>${esc(title)}</h3>${o.sub?`<span class="sub">${o.sub}</span>`:''}<div class="vis-tools">${o.add&&o.addOk?`<button class="btn sm" data-act="${o.add.act}">＋ ${esc(o.add.label)}</button>`:''}${showTools&&anyEdit?toolbar(id):'<span class="ro-pill">Read-only</span>'}</div></div>`;
 if(o.banner)h+=`<div class="banner ${o.bannerInfo?'info':''}">${o.banner}</div>`;
 h+=`<div class="grid-wrap"><table class="grid"><thead><tr>${cols.map(c=>`<th class="${c.align==='r'?'':'l'}">${esc(c.label)}</th>`).join('')}${o.del?'<th></th>':''}</tr></thead><tbody>`;
 if(!rows.length)h+=`<tr><td colspan="${cols.length+1}" class="txt" style="padding:18px;color:var(--muted)">${o.empty||'No rows.'}</td></tr>`;
 rows.forEach(r=>{const ed=o.canEditRow(r);const rk=String(r[key]);h+='<tr>';
  cols.forEach(c=>{const k=pk(id,rk,c.k),p=k in PEND;const raw=r[c.k];
   if(c.type==='calc'){h+=`<td class="${c.align==='r'?'num':'txt'} ro">${c.fmt(r)}</td>`;return}
   if(!ed||c.ro){let disp=c.type==='select'?((c.opts(r).find(x=>String(x[0])===String(raw))||[0,raw])[1]):c.type==='bool'?(raw?'✓':'—'):c.type==='num'?(c.dec?f2(raw):f0(raw)):raw;
    h+=`<td class="${c.type==='num'?'num':'txt'} ro ${c.type==='bool'?'chk':''}">${c.html?c.html(r):esc(disp)}</td>`;return}
   if(c.type==='select'){const cur=p?PEND[k]:String(raw);h+=`<td class="in ${p?'pend':''}"><select class="cell" data-vis="${id}" data-r="${esc(rk)}" data-c="${c.k}" data-t="s" data-o="${esc(raw)}" aria-label="${esc(c.label)}">${c.opts(r).map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`).join('')}</select></td>`}
   else if(c.type==='bool'){const cur=p?PEND[k]:raw;h+=`<td class="in chk ${p?'pend':''}"><input type="checkbox" data-vis="${id}" data-r="${esc(rk)}" data-c="${c.k}" data-t="b" data-o="${raw?'true':'false'}" ${cur?'checked':''} aria-label="${esc(c.label)}"></td>`}
   else{const isN=c.type==='num';const ov=isN?(c.dec?f2(raw):f0(raw)):String(raw??'');h+=`<td class="in ${p?'pend':''}" style="${c.w?`min-width:${c.w}px`:''}"><input class="cell ${isN?'':'t'}" data-vis="${id}" data-r="${esc(rk)}" data-c="${c.k}" data-t="${isN?'n':'s'}" data-o="${esc(ov)}" value="${esc(p?PEND[k]:ov)}" ${isN?'inputmode="decimal"':''} aria-label="${esc(c.label)}"></td>`}});
  if(o.del)h+=`<td class="num" style="min-width:34px;padding:0 4px">${ed&&(!o.delOk||o.delOk(r))?`<button class="delbtn" data-act="${o.del}" data-id="${esc(rk)}" aria-label="Delete row" title="Delete row">✕</button>`:''}</td>`;
  h+='</tr>'});
 h+=`</tbody></table></div>${visFoot(o.table,o.foot||'')}</section>`;return h}
function applyAM(list,cols,entries,module,objF,key='id'){
 const changed=new Set();
 entries.forEach(({r,c,val})=>{const row=list.find(x=>String(x[key])===r);if(!row)return;const col=cols.find(x=>x.k===c);if(!col)return;let nv=val;
  if(col.type==='num'){nv=parseNum(val);if(nv==null)return}else if(col.type==='bool')nv=(val===true||val==='true');else if(col.numeric)nv=+val;
  const old=row[c];if(String(old)===String(nv))return;row[c]=nv;changed.add(row);
  const show=x=>col.type==='select'?((col.opts(row).find(o=>String(o[0])===String(x))||[0,x])[1]):col.type==='bool'?(x?'Yes':'No'):col.type==='num'?(col.dec?f2(x):f0(x)):x;
  log(module,objF(row),`${col.label}: ${show(old)} → ${show(nv)}`)});return [...changed]}

function plRows(pl,{vid,dept,inputs=false,chips=true}){
 const sb=subs(pl);const P=S.plans[vid];
 return LAYOUT.map(l=>{if(l.sub)return {sub:true,label:l.label,strong:l.strong,vals:sb[l.sub]};
  const a=ACCM[l.acc];let chip='',input=false;
  if(chips){if(a.src==='employee')chip=`<span class="chip" data-nav="emp-pay" title="Calculated in Employee Planning">Employee Planning ›</span>`;
   else if(a.src==='pipeline')chip=`<span class="chip" data-nav="sal-phase" title="Run-rate plus weighted pipeline">Sales Pipeline ›</span>`;
   else if(a.src==='capex')chip=`<span class="chip" data-nav="cap-dep" title="Straight-line depreciation">CAPEX Planning ›</span>`;
   else if(P&&dept){const d=(P.drivers[dept]||{})[a.id];if(d&&d.m!=='manual')chip=`<span class="chip drv" data-nav="acc-drv" title="Driver-based">${esc(drvText(d,vid))} ›</span>`;else input=true}}
  return {key:a.id,code:a.id,label:a.name,vals:signed(a.id,pl[a.id]),input:inputs&&input,sign:a.type==='rev'?1:-1,chip,comment:P&&dept?((P.comments[dept]||{})[a.id]||''):''}})}

 return d.m==='ly'?`${d.p>=0?'+':''}${f2(d.p)}% vs ${r?r.name.replace(/ \(.*\)/,''):'ref'}`:d.m==='fte'?`${f2(d.p)}k per FTE`:d.m==='rev'?`${f2(d.p)}% of revenue`:'Manual'}

function doCopy(){
 const src=$('#cv-src').value,name=$('#cv-name').value.trim()||'New version',type=$('#cv-type').value,ref=$('#cv-ref').value;
 const m=k=>$('#cv-m-'+k).checked;const sv=getV(src),P=S.plans[src],blank=makePlanEmpty();const np=clone(P);
 if(!m('acc')){np.manual=blank.manual;np.drivers=blank.drivers;np.comments=blank.comments}
 if(!m('emp'))np.employees=[];if(!m('sal')){np.deals=[];np.runrate=z12()}if(!m('cap'))np.capex=[];if(!m('asm'))np.assum=clone(blank.assum);
 DEPTS.forEach(d=>np.wf[d.id]='Not started');
 const id='V'+(S.seq.ver++);S.versions.push({id,name,type,year:sv.year,actualsThrough:type==='Forecast'?sv.actualsThrough:0,ref,status:'Open'});S.plans[id]=np;bust();
 log('Admin Center',name,`Copied from ${sv.name}`);S.sel.version=id;toast(`Created “${name}”. It is now selected in every report.`);go('adm-ver')}
function makePlanEmpty(){const p={manual:{},drivers:{},comments:{}};DEPTS.forEach(d=>{p.manual[d.id]={};p.drivers[d.id]={};p.comments[d.id]={};ACC.forEach(a=>{if(a.src==='manual')p.manual[d.id][a.id]=z12()})});p.assum={wageInc:0,wageMonth:1,social:0,pLead:10,pQualified:25,pProposal:50,pNegotiation:75,pWon:100};return p}

page('acc-drv',{title:'Driver planning',desc:v=>`Replace manual input with a driver for any plannable account. Drivers recalculate when headcount, revenue or the reference version change.`,slicers:['version','dept'],render(){

 const v=ver(),ref=v.ref?getV(v.ref):null;const ds=myDepts();const per=ds.map(d=>plAgg(v.id,[d.id]));const tot=plAgg(v.id),rt=ref?plAgg(ref.id):null;

function rlsBlock(dn){return `<div class="restricted"><svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0110 0v3M5 10h14v11H5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><h2>No rows for ${esc(me().name)}</h2><p>Row-level security hides ${esc(dn)} data for this user.</p></div>`}

/* ============================== shell rendering ============================== */
const ICON={home:'<path d="M3 9l7-6 7 6v8H3z" fill="none" stroke="currentColor" stroke-width="1.5"/>',report:'<rect x="3" y="2" width="14" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="10" width="2" height="5" fill="currentColor"/><rect x="9" y="7" width="2" height="8" fill="currentColor"/><rect x="12" y="11" width="2" height="4" fill="currentColor"/>',
 chev:'<path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/>',lock:'<path d="M6 9V6.5a4 4 0 018 0V9M4.5 9h11v8h-11z" fill="none" stroke="currentColor" stroke-width="1.4"/>'};
const svgI=(k,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 20 20" aria-hidden="true">${ICON[k]}</svg>`;
function renderNav(){
 let h='<div class="nav-inner"><div class="nav-title">Reports</div>';
 NAV.forEach(n=>{if(!n.pages){h+=`<button class="nitem ${S.ui.page===n.id?'sel':''}" data-nav="${n.id}">${svgI(n.icon)} ${esc(n.label)}</button>`;return}
  const open=S.ui.open.has(n.id);const locked=n.admin&&!isAdmin();
  h+=`<button class="nitem report ${open?'open':''}" data-act="toggleReport" data-id="${n.id}" aria-expanded="${open}">${svgI('report')} ${esc(n.label)}${locked?`<span class="lock" title="Admins only">${svgI('lock',14)}</span>`:`<span class="chev">${svgI('chev',12)}</span>`}</button>`;
  if(open&&!locked)n.pages.forEach(([pid,pl])=>{h+=`<button class="nitem page ${S.ui.page===pid?'sel':''}" data-nav="${pid}">${esc(pl)}</button>`})});
 h+='</div>';$('#nav').innerHTML=h}
function renderActionbar(){const r=reportOf(S.ui.page);
 $('#actionbar').innerHTML=`<span class="crumb">${r?esc(r.label)+' <span>›</span> ':''}${esc(pageLabel(S.ui.page))}</span>
 <button class="abtn" data-act="na">File</button><button class="abtn" data-act="na">Export</button><button class="abtn" data-act="na">Share</button><span class="sep"></span>
 <button class="abtn" data-act="resetFilters">${svgI('home',14).replace(ICON.home,'<path d="M4 10a6 6 0 1 0 2-4.5M4 3v3h3" fill="none" stroke="currentColor" stroke-width="1.5"/>')} Reset filters</button>
 <button class="abtn" data-act="toggleFilters">Filters</button><span class="stamp">Data refreshed 16 Oct 2026, 07:00</span>`}
function slicerHTML(k){
 if(k==='version')return `<label class="slicer" for="sl-version"><span>Version <span class="wtag" title="Decides which version you write into">WRITE SCOPE</span></span><select id="sl-version" data-slicer="version">${S.versions.map(v=>`<option value="${v.id}" ${v.id===S.sel.version?'selected':''}>${esc(v.name)}${v.status==='Locked'?' 🔒':''}</option>`).join('')}</select></label>`;
 if(k==='dept')return `<label class="slicer" for="sl-dept"><span>Department <span class="wtag" title="Decides which department you write into">WRITE SCOPE</span></span><select id="sl-dept" data-slicer="dept">${myDepts().length>1?`<option value="ALL" ${S.sel.dept==='ALL'?'selected':''}>All my departments</option>`:''}${myDepts().map(d=>`<option value="${d.id}" ${d.id===S.sel.dept?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>`;
 if(k==='cmpA'||k==='cmpB')return `<label class="slicer" for="sl-${k}"><span>${k==='cmpA'?'Version A':'Version B'}</span><select id="sl-${k}" data-slicer="${k}">${S.versions.map(v=>`<option value="${v.id}" ${v.id===S.sel[k]?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>`;
 if(k==='auditMod')return `<label class="slicer" for="sl-mod"><span>Module</span><select id="sl-mod" data-slicer="auditMod">${['All','Admin Center','Account Planning','Employee Planning','Sales Pipeline','CAPEX Planning'].map(m=>`<option ${m===S.sel.auditMod?'selected':''}>${m}</option>`).join('')}</select></label>`;
 return ''}
function renderPage(){
 SAVE={};const P=PAGES[S.ui.page];const v=ver();let body;
 if(P.admin&&!isAdmin())body=`<div class="restricted">${svgI('lock',36)}<h2>Admin Center is for FP&amp;A admins</h2><p>${esc(me().name)} has the ${esc(me().role)} role. Switch <b>Viewing as</b> to Kim to manage versions, users and assumptions.</p></div>`;
 else body=`<div class="pbody">${P.render()}</div>`;
 const head=`<div class="phead"><div class="ttl"><h1>${esc(P.title)}</h1><p>${esc(typeof P.desc==='function'?P.desc(v):P.desc||'')}</p></div><div class="slicers">${(P.admin&&!isAdmin())?'':(P.slicers||[]).map(slicerHTML).join('')}</div></div>`;
 $('#canvas').innerHTML=`<div class="rpage">${head}${body}</div>`}
function renderFilters(){const fp=$('#fpane');fp.classList.toggle('open',S.ui.filters);const v=ver();const P=PAGES[S.ui.page];const sl=P.slicers||[];
 fp.innerHTML=`<button class="ftoggle" data-act="toggleFilters" aria-label="Toggle filters pane">${svgI('chev',12).replace('M7 4l6 6-6 6',S.ui.filters?'M7 4l6 6-6 6':'M13 4l-6 6 6 6')}<span>Filters</span></button>
 <div class="fbody"><h4>On this page</h4>${sl.includes('version')?`<div class="fcard"><b>Version</b><span>is ${esc(v.name)}</span></div>`:''}${sl.includes('dept')?`<div class="fcard"><b>Department</b><span>is ${S.sel.dept==='ALL'?'(All my departments)':esc(dname(S.sel.dept))}</span></div>`:''}${sl.length?'':'<div class="fcard"><span>No page filters</span></div>'}
 <h4>On all pages</h4><div class="fcard"><b>Legal entity</b><span>is Nordlys Group A/S</span></div><div class="fcard"><b>Currency</b><span>is DKK</span></div>
 <h4>Row-level security</h4><div class="fcard"><b>${esc(me().name)}</b><span>${esc(myDepts().map(d=>d.name).join(', ')||'No departments')}</span></div></div>`}
function renderHeader(){$('#viewas').innerHTML=S.users.map(u=>`<option value="${u.id}" ${u.id===S.me?'selected':''}>${esc(u.name)} · ${esc(u.role)}</option>`).join('');$('#avatar').textContent=me().name.split(' ').map(x=>x[0]).join('').slice(0,2)}
function render(){fixSel();renderHeader();renderNav();renderActionbar();renderPage();renderFilters()}
function fixSel(){const ds=myDeptIds();if(S.sel.dept!=='ALL'&&!ds.includes(S.sel.dept))S.sel.dept=ds[0]||'ALL';if(S.sel.dept==='ALL'&&ds.length===1)S.sel.dept=ds[0];if(!getV(S.sel.version))S.sel.version='B27'}
function go(p){if(!PAGES[p])p='home';S.ui.page=p;const r=reportOf(p);if(r)S.ui.open.add(r.id);try{history.replaceState(null,'','#'+p)}catch(e){}
 if(window.matchMedia('(max-width:820px)').matches)$('#app').classList.add('nav-off');render();$('#canvas').scrollTop=0}

/* ============================== actions ============================== */
const ACT={
 toggleNav(){$('#app').classList.toggle('nav-off')},
 toggleReport(el){const id=el.dataset.id;S.ui.open.has(id)?S.ui.open.delete(id):S.ui.open.add(id);const n=NAV.find(x=>x.id===id);if(S.ui.open.has(id)&&n&&!(n.admin&&!isAdmin())&&!n.pages.some(p=>p[0]===S.ui.page)){go(n.pages[0][0]);return}if(n&&n.admin&&!isAdmin()){go(n.pages[0][0]);return}renderNav()},
 toggleFilters(){S.ui.filters=!S.ui.filters;renderFilters()},
 resetFilters(){S.sel.version='B27';S.sel.dept=myDepts().length>1?'ALL':(myDeptIds()[0]||'ALL');S.sel.cmpA='B27';S.sel.cmpB='F26';S.sel.auditMod='All';render();toast('Filters reset to the app defaults')},
 na(){toast('Not part of this simulation')},
 save(el){const id=el.dataset.vis;const keys=Object.keys(PEND).filter(k=>k.startsWith(id+'|'));if(!SAVE[id]){toast('Nothing to save');return}
  const entries=keys.map(k=>{const [,r,c]=k.split('|');return {r,c,val:PEND[k]}});const n=entries.length;SAVE[id](entries);keys.forEach(k=>delete PEND[k]);bust();render();toast(`Saved ${n} change${n>1?'s':''}. Every report now shows the new numbers.`)},
 discard(el){const id=el.dataset.vis;Object.keys(PEND).filter(k=>k.startsWith(id+'|')).forEach(k=>delete PEND[k]);render();toast('Changes discarded')},
 submit(el){const v=ver(),d=el.dataset.id;S.plans[v.id].wf[d]='Submitted';log('Account Planning',`${dname(d)} · ${v.name}`,'Status: In progress → Submitted');render();toast(`${dname(d)} submitted. The grid is now locked until it is approved or sent back.`)},
 wf(el){const v=ver(),d=el.dataset.id,to=el.dataset.to;const P=S.plans[v.id];const from=P.wf[d];P.wf[d]=to;log('Admin Center',`${dname(d)} · ${v.name}`,`Status: ${from} → ${to}`);render();toast(`${dname(d)}: ${to}`)},
 openDept(el){S.sel.dept=el.dataset.id;go('acc-pnl')},
 addEmp(){const v=ver(),P=S.plans[v.id];const d=S.sel.dept!=='ALL'?S.sel.dept:(myDepts().find(x=>canEdit(v.id,x.id))||{}).id;if(!d)return;const id='TBH-'+(++S.seq.emp);
  P.employees.push({id,name:'New hire (TBH)',dept:d,title:'To be defined',salary:45000,pension:10,fte:1,start:Math.min(12,(v.actualsThrough||0)+1),end:13});touch(v.id,d);bust();log('Employee Planning',`${id} New hire (TBH)`,`Added to ${dname(d)}`);render();toast('New hire added. Edit the row, then Save.')},
 delEmp(el){const v=ver(),P=S.plans[v.id];const e=P.employees.find(x=>x.id===el.dataset.id);P.employees=P.employees.filter(x=>x.id!==el.dataset.id);bust();log('Employee Planning',`${e.id} ${e.name}`,'Deleted');render();toast(`${e.name} removed`)},
 addDeal(){const v=ver(),P=S.plans[v.id];const id='D'+String(++S.seq.deal).padStart(2,'0');P.deals.push({id,customer:'New customer',desc:'New opportunity',stage:'Lead',amount:500,type:'Subscription',close:Math.min(12,(v.actualsThrough||0)+3)});touch(v.id,'SAL');bust();log('Sales Pipeline',id,'Added');render();toast('Deal added')},
 delDeal(el){const v=ver(),P=S.plans[v.id];const dl=P.deals.find(x=>x.id===el.dataset.id);P.deals=P.deals.filter(x=>x.id!==el.dataset.id);bust();log('Sales Pipeline',`${dl.id} ${dl.customer}`,'Deleted');render();toast('Deal removed')},
 addCap(){const v=ver(),P=S.plans[v.id];const d=S.sel.dept!=='ALL'?S.sel.dept:(myDepts().find(x=>canEdit(v.id,x.id))||{}).id;if(!d)return;const id='C'+String(++S.seq.cap).padStart(2,'0');P.capex.push({id,asset:'New investment',dept:d,cat:'Equipment',amount:100,month:Math.min(12,(v.actualsThrough||0)+1),life:3});touch(v.id,d);bust();log('CAPEX Planning',id,`Added to ${dname(d)}`);render();toast('Investment added')},
 delCap(el){const v=ver(),P=S.plans[v.id];const c=P.capex.find(x=>x.id===el.dataset.id);P.capex=P.capex.filter(x=>x.id!==el.dataset.id);bust();log('CAPEX Planning',`${c.id} ${c.asset}`,'Deleted');render();toast('Investment removed')}};

document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){e.preventDefault();go(n.dataset.nav);return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]&&!a.disabled){e.preventDefault();ACT[a.dataset.act](a)}});
document.addEventListener('keydown',e=>{const t=e.target;
 if(t.classList&&t.classList.contains('mapbox')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(t.dataset.nav);return}
 if(t.classList&&t.classList.contains('cell')&&t.tagName==='INPUT'&&['Enter','ArrowDown','ArrowUp'].includes(e.key)){
  const td=t.closest('td'),tr=td.parentElement,idx=[...tr.children].indexOf(td);let r=e.key==='ArrowUp'?tr.previousElementSibling:tr.nextElementSibling;
  while(r){const c=r.children[idx];const inp=c&&c.querySelector('input.cell');if(inp){e.preventDefault();t.dispatchEvent(new Event('change',{bubbles:true}));inp.focus();inp.select();return}r=e.key==='ArrowUp'?r.previousElementSibling:r.nextElementSibling}}});
document.addEventListener('submit',e=>{if(e.target.id==='copyform'){e.preventDefault();doCopy()}});
$('#viewas').addEventListener('change',e=>{S.me=e.target.value;fixSel();const P=PAGES[S.ui.page];render();toast(`Viewing as ${me().name}`)});
$('#canvas').addEventListener('focusin',e=>{const t=e.target;if(t.classList&&t.classList.contains('cell')&&t.tagName==='INPUT')setTimeout(()=>{try{t.select()}catch(_){}},0)});
$('#canvas').addEventListener('change',e=>{const t=e.target;
 if(t.dataset.slicer){S.sel[t.dataset.slicer]=t.value;render();return}
 if(!t.dataset.vis)return;const k=pk(t.dataset.vis,t.dataset.r,t.dataset.c);let val=t.type==='checkbox'?t.checked:t.value;const o=t.dataset.o;let same;
 if(t.dataset.t==='n'){let n=parseNum(val);if(n==null){toast('Enter a number, for example 1,250');t.value=k in PEND?PEND[k]:o;return}
  if(t.dataset.sign==='-1')n=-Math.abs(n);const fmtd=t.closest('table.grid')&&t.dataset.sign?f0(n):(Number.isInteger(n)?f0(n):f2(n));t.value=fmtd;val=fmtd;same=parseNum(o)===parseNum(fmtd)}
 else if(t.dataset.t==='b')same=String(val)===o;else same=String(val)===o;
 if(same)delete PEND[k];else PEND[k]=val;
 t.closest('td').classList.toggle('pend',k in PEND);
 const n=pendCount(t.dataset.vis);document.querySelectorAll(`[data-cnt="${t.dataset.vis}"]`).forEach(x=>{x.dataset.n=n;x.textContent=n+' unsaved'});
 document.querySelectorAll(`[data-act="save"][data-vis="${t.dataset.vis}"],[data-act="discard"][data-vis="${t.dataset.vis}"]`).forEach(b=>b.disabled=!n);
 const tr=t.closest('tr'),fy=tr&&tr.querySelector('td.fy');if(fy&&t.dataset.t==='n'&&t.dataset.sign){let s=0;tr.querySelectorAll('td[data-v]').forEach(x=>s+=+x.dataset.v);tr.querySelectorAll('input.cell[data-t="n"]').forEach(x=>s+=parseNum(x.value)||0);fy.textContent=f0(s)}});

/* ============================== boot ============================== */
(function(){let h='';try{h=(location.hash||'').slice(1)}catch(e){}if(window.matchMedia('(max-width:820px)').matches)$('#app').classList.add('nav-off');go(PAGES[h]?h:'home')})();
</script>

</body></html>
